<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ cargo_name }} | MAKYAMA CARGO TRACKER</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">🌍</div>
        <span>MAKYAMA TRACKER</span>
      </a>
      <div class="nav-links">
        <span class="code-pill" id="navCargoName">{{ cargo_name }}</span>
        <a href="/" class="btn btn-outline btn-sm">Tafuta Mwingine</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="card" id="unlockSection" style="max-width: 480px; margin: 30px auto;">
      <h2 style="margin-bottom: 6px;">🔐 Ingiza Code ya Mzigo</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 18px;">
        Mzigo: <strong>{{ cargo_name }}</strong>. Ingiza code yako (Owner au Agent) ili kufungua.
      </p>
      <form id="unlockForm">
        <div class="form-group">
          <label>Code Yako ya Siri *</label>
          <input type="text" id="accessCodeInput" class="form-control" placeholder="Mf. OWN-8X92A au AGT1-3K91B" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">🔓 Fungua Mzigo</button>
      </form>
      <div id="unlockError"></div>
    </div>

    <div id="trackingWorkspace" style="display: none;">
      <div class="card" style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px;">
          <div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
              <h2 id="cargoTitle">-</h2>
              <span class="badge-pill" id="roleBadge" style="margin: 0;">-</span>
            </div>
            <p id="routeSubtitle" style="color: var(--text-muted); margin-top: 6px;">-</p>
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="button" id="refreshCargoBtn" class="btn btn-outline btn-sm">🔄 Refresh Data</button>
            <button type="button" id="lockAgainBtn" class="btn btn-danger btn-sm">Funga</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3>🌍 Global Map (GPS Live Points)</h3>
          <span style="color: var(--text-muted); font-size: 0.84rem;">GPS inasoma kiotomatiki kila tick</span>
        </div>
        <div id="globalMap" class="map-wrapper"></div>
      </div>

      <div class="card" id="ownerManagePanel" style="display: none; margin-bottom: 20px;">
        <h3 style="margin-bottom: 12px;">👑 Ongeza Agent Mpya (Owner Pekee)</h3>
        <form id="addNewAgentForm" class="grid-2" style="align-items: end;">
          <div class="form-group" style="margin: 0;">
            <label>Jina la Agent Mpya</label>
            <input type="text" id="newAgentName" class="form-control" placeholder="Mf. Musa Ali" required />
          </div>
          <button type="submit" class="btn btn-success">+ Ongeza Agent</button>
        </form>
      </div>

      <div id="actionAlert"></div>
      <div id="agentsTimeline"></div>
    </div>
  </main>

  <footer>
    <a href="https://wa.me/255740770786" target="_blank" class="whatsapp-footer-btn" title="Chat WhatsApp Customer Care">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.52 3.48A11.82 11.82 0 0 0 12.07 0C5.5 0 .16 5.34.16 11.91c0 2.1.55 4.15 1.6 5.96L0 24l6.3-1.65a11.87 11.87 0 0 0 5.77 1.47h.01c6.57 0 11.91-5.34 11.91-11.91 0-3.18-1.24-6.17-3.49-8.43zm-8.44 18.33h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.85 9.85 0 0 1-1.51-5.23c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.9 7c0 5.45-4.44 9.89-9.9 9.89zm5.43-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.49s1.07 2.89 1.22 3.09c.15.2 2.11 3.22 5.11 4.52.71.31 1.27.49 1.7.63.72.23 1.37.2 1.89.12.58-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/>
      </svg>
    </a>
    <span>&copy; 2026 MAKYAMA CARGO TRACKER</span>
  </footer>

  <script>
    window.CARGO_NAME = "{{ cargo_name }}";
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/cargo.js"></script>
</body>
</html>
