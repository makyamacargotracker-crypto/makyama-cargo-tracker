<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | MAKYAMA CARGO TRACKER</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container" style="max-width: 100%;">
      <a href="/admin" class="brand">
        <div class="brand-icon">🛡️</div>
        <span>MAKYAMA ADMIN</span>
      </a>
      <div class="nav-links" style="margin-left: auto;">
        <a href="/" class="btn btn-outline btn-sm">Website Kuu</a>
        <a href="/logout" class="btn btn-danger btn-sm">Toka (Logout)</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="grid-3" style="margin-bottom: 20px;">
      <div class="card">
        <span style="color: var(--text-muted); font-size: 0.85rem;">Jumla ya Mizigo</span>
        <h2 id="statTotalCargos" style="font-size: 2rem; margin-top: 4px;">0</h2>
      </div>
      <div class="card">
        <span style="color: var(--text-muted); font-size: 0.85rem;">Jumla ya Ma-Agent</span>
        <h2 id="statTotalAgents" style="font-size: 2rem; margin-top: 4px;">0</h2>
      </div>
      <div class="card">
        <span style="color: var(--text-muted); font-size: 0.85rem;">Mizigo Iliyokamilika</span>
        <h2 id="statCompletedCargos" style="font-size: 2rem; margin-top: 4px; color: var(--success);">0</h2>
      </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
      <h3 style="margin-bottom: 12px;">🌍 Global Map ya Mizigo Yote</h3>
      <div id="adminGlobalMap" class="map-wrapper"></div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
        <h3>📦 Mizigo Yote, Routi & Code za Siri</h3>
        <input type="text" id="adminFilterInput" class="form-control" style="max-width: 280px;" placeholder="Chuja kwa jina au code..." />
      </div>
      <div id="adminCargosList"></div>
    </div>
  </main>
