services:
  - type: web
    name: makyama-cargo-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: makyama2026
      - key: FIREBASE_DB_URL
        value: https://makyama-cargo-tracker-default-rtdb.firebaseio.com/
